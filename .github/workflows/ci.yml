# Runs the server test suite (unit, database, backup/restore, boot and the
# kmbot end-to-end scenarios) and builds the client APK on every push and PR.
name: CI

# Pushes to main, and every PR (feature branches are covered through their
# PR, so a branch push doesn't run everything twice).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run server/scripts/test.sh
        run: ./server/scripts/test.sh

  client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the NDK and CMake the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" \
              "ndk;26.2.11394342" "cmake;3.22.1" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Client protocol parser test
        run: ./app/src/test/kmui/run.sh

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK has no Rockstar files
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$apk" | grep -E "libGTASA|libSCAnd|libImmEmulatorJ|assets/(data|Text)/"; then
              echo "The APK must not contain GTA:SA files."; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kingmakers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
