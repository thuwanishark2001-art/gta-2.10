# The content service: serves server/content/ read-only, plus the
# manifest.json that 40-km-manifest.sh builds at start.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /srv/content;
    autoindex off;
    # No hidden files (.gitkeep and the like).
    location ~ /\. { return 404; }

    location = /manifest.json {
        root /srv/meta;
        add_header Cache-Control "no-cache";
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
