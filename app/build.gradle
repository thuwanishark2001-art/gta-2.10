plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        // Release signing comes from keystore.properties (never committed).
        // Debug builds use the Android SDK's default debug keystore.
        def ksFile = rootProject.file('keystore.properties')
        if (ksFile.exists()) {
            def ks = new Properties()
            ksFile.withInputStream { ks.load(it) }
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    compileSdk 34
    namespace 'com.samp.mobile'

    defaultConfig {
        applicationId "com.samp.mobile"
        minSdk 26
        targetSdk 34
        // Release builds pass -PkmVersionCode (the CI run number) so each one
        // installs over the last.
        versionCode((project.findProperty('kmVersionCode') ?: '2') as int)
        versionName project.findProperty('kmVersionName') ?: "SA"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                // shadowhook's prefab package is only published for the shared STL
                arguments "-DANDROID_STL=c++_shared",
                        // Game server the client joins. Override with
                        // ./gradlew -PkmServerHost=1.2.3.4 -PkmServerPort=7777 ...
                        "-DKM_SERVER_HOST=${project.findProperty('kmServerHost') ?: '65.20.88.67'}",
                        "-DKM_SERVER_PORT=${project.findProperty('kmServerPort') ?: '7777'}"
            }
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    ndkVersion '26.2.11394342'

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            minifyEnabled false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName('release')
        }
        all{
            multiDexEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation "com.google.android.material:material:1.3.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Scalable dp/sp dimensions (@dimen/_Nsdp) used by the layouts
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    testImplementation 'junit:junit:4.13.2'

    // @Obfuscate annotation used by the game UI classes
    compileOnly "com.joom.paranoid:paranoid-core:0.3.14"
    // Native hooking library, consumed by CMake through prefab
    implementation 'com.bytedance.android:shadowhook:1.0.9'
}
